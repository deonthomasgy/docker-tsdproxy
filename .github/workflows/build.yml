name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests, race detector, module verification and vet
        run: docker build --target test --progress=plain .
      - name: Build runtime image
        run: docker build --build-arg GIT_COMMIT="$GITHUB_SHA" -t princeamd/tsdproxy:verify .
      - name: Scan all severities and enforce no critical or high findings
        run: |
          mkdir -p reports
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/reports:/reports" aquasec/trivy:0.75.0 image --scanners vuln --format json --output /reports/trivy.json princeamd/tsdproxy:verify
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.75.0 image --scanners vuln --severity CRITICAL,HIGH --exit-code 1 princeamd/tsdproxy:verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-report
          path: reports/
